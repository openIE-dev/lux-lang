name: Release

# Builds the `lux` binary (crates/bin/lux-cli in the private openIE-dev/joulesperbit
# repo) and publishes a GitHub Release whose assets match the openie-lux crates.io
# stub (stubs/openie-lux): openie-lux-<version>-<target>.tar.gz, containing
# openie-lux-<version>-<target>/lux. Modeled on the jmax and joule-lang release
# workflows.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.0). Must match stubs/openie-lux version.'
        required: true
        type: string
      source_ref:
        description: 'joulesperbit ref (commit/branch/tag) to build lux-cli from'
        required: true
        default: main
        type: string

env:
  BIN_NAME: lux
  RELEASE_NAME: openie-lux

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            # Native Intel runner: lux-cli pulls in openssl-sys, which can't
            # find an x86_64 OpenSSL when cross-compiling on arm64 macos-14.
            os: macos-15-intel
            # The 4-core / 14 GB Intel runner got SIGTERM (exit 143) mid-build
            # with full parallelism (v0.2.1 run 39145203470); cap rustc jobs.
            cargo_jobs: 2
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout public release surface
        uses: actions/checkout@v4

      - name: Checkout private source (joulesperbit)
        uses: actions/checkout@v4
        with:
          repository: openIE-dev/joulesperbit
          token: ${{ secrets.JOULESPERBIT_READ_TOKEN }}
          path: joulesperbit
          ref: ${{ inputs.source_ref }}

      - name: Record source commit
        id: src
        shell: bash
        run: echo "sha=$(git -C joulesperbit rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reclaim disk + add swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/microsoft /opt/google /usr/lib/jvm || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo fallocate -l 8G /swapfile.rel && sudo chmod 600 /swapfile.rel && sudo mkswap /swapfile.rel && sudo swapon /swapfile.rel || true
          free -h; df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target to the pinned toolchain
        shell: bash
        working-directory: joulesperbit
        # joulesperbit pins its toolchain in rust-toolchain.toml, so the target
        # added to stable above isn't the one cargo uses here.
        run: rustup target add ${{ matrix.target }}

      - name: Install Python (workspace stub script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stub out-of-tree path deps
        working-directory: joulesperbit
        # Some workspace members depend on sibling checkouts that aren't in the
        # repo; cargo resolves the whole workspace, so give them placeholders
        # (same step joulesperbit's own lux CI uses).
        run: python3 scripts/ci/stub-out-of-tree-path-deps.py

      - name: Build lux (workspace release profile)
        shell: bash
        working-directory: joulesperbit
        # -p lux-cli: avoid unifying features across every workspace member.
        # No --locked: the stub step above adds placeholder crates, which
        # rewrites Cargo.lock (joulesperbit's own lux CI builds the same way).
        env:
          CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs || '' }}
        run: |
          [ -n "$CARGO_BUILD_JOBS" ] || unset CARGO_BUILD_JOBS
          cargo build --release --target ${{ matrix.target }} -p lux-cli --bin lux

      - name: Smoke test (native targets)
        shell: bash
        run: |
          BIN="joulesperbit/target/${{ matrix.target }}/release/${BIN_NAME}"
          file "$BIN" || true
          RUN="$BIN"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then RUN="arch -x86_64 $BIN"; else echo "no Rosetta on this runner; skipping x86_64 run"; exit 0; fi
          fi
          $RUN --version
          # Use the counter example from the source tree being released (the
          # parse-gated examples/ in joulesperbit), not this repo's docs copy.
          EX=joulesperbit/examples/04-counter/main.lux
          $RUN check "$EX"
          # Compile the counter to HTML (informational: the release smoke test
          # that gates publishing is run against the downloaded assets).
          if $RUN build "$EX" -t html -o "$RUNNER_TEMP/counter.html"; then
            ls -la "$RUNNER_TEMP/counter.html" || true
          else
            echo "::warning::lux build -t html failed for the counter example"
          fi
          echo "smoke OK"

      - name: Package
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          BASE="${RELEASE_NAME}-${TAG#v}-${{ matrix.target }}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/$BASE"
          cp "joulesperbit/target/${{ matrix.target }}/release/${BIN_NAME}" "$STAGE/$BASE/"
          cp LICENSE-MIT LICENSE-APACHE COPYRIGHT README.md "$STAGE/$BASE/" 2>/dev/null || true
          (cd "$STAGE" && tar czf "${BASE}.tar.gz" "$BASE")
          mv "$STAGE/${BASE}.tar.gz" .
          shasum -a 256 "${BASE}.tar.gz" > "${BASE}.tar.gz.sha256"
          echo "${{ steps.src.outputs.sha }}" > "source-${{ matrix.target }}.txt"
          ls -la "${BASE}".tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_NAME }}-*-${{ matrix.target }}.tar.gz*
            source-${{ matrix.target }}.txt

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        id: collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec mv {} dist/ \;
          SRC=$(cat artifacts/*/source-*.txt | sort -u)
          test "$(echo "$SRC" | wc -l)" -eq 1
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: openie-lux ${{ inputs.tag }}
          body: |
            `lux` CLI binaries for macOS (arm64, x86_64) and Linux (x86_64, aarch64; glibc).

            Install with `cargo binstall openie-lux`, or download an archive below.

            Built from openIE-dev/joulesperbit `${{ steps.collect.outputs.src }}` (crates/bin/lux-cli, workspace release profile).
          files: dist/*
          fail_on_unmatched_files: true
